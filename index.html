<title>Consulta de Siniestros — Mercantil Seguros</title>
<link rel="stylesheet" href="styles.css">

<!-- ===== ESTRUCTURA PRINCIPAL ===== -->
<div id="app">

  <!-- HEADER -->
  <header style="background:linear-gradient(135deg,#002b66 0%,#004b87 100%);color:#fff;box-shadow:0 4px 6px -1px rgba(0,0,0,.1);border-bottom:1px solid rgba(255,255,255,.1);">
    <div style="max-width:80rem;margin:0 auto;padding:0 1rem;height:3.5rem;display:flex;justify-content:space-between;align-items:center;">
      <div style="display:flex;align-items:center;gap:1rem;">
        <div style="background:#fff;padding:.375rem .625rem;border-radius:.5rem;box-shadow:0 1px 2px 0 rgba(0,0,0,.05);display:flex;align-items:center;">
          <img src="sm.webp" alt="Descripción de la imagen">
        </div>
        <div style="border-left:1px solid rgba(96,165,250,.4);padding-left:.75rem;display:none;" class="sm:block">
          <h1 style="font-size:.875rem;font-weight:600;letter-spacing:.025em;color:#fff;margin:0;">Consulta de Estatus de Siniestros</h1>
        </div>
      </div>
      <div style="width:2rem;height:2rem;border-radius:9999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;">
        <svg style="width:1.25rem;height:1.25rem;opacity:.9;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    <!-- Barra de búsqueda -->
    <section style="background:#fff;padding:.75rem;border-radius:.75rem;border:1px solid #e2e8f0;box-shadow:0 1px 2px 0 rgba(0,0,0,.05);display:flex;flex-direction:column;gap:.75rem;flex-shrink:0;">
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;">

        <!-- Toggle Placa / Siniestro -->
        <div style="display:flex;background:#f1f5f9;padding:.25rem;border-radius:.5rem;border:1px solid #e2e8f0;flex-shrink:0;">
          <button id="btn-mode-placa" data-action="setMode" data-mode="placa"
            style="padding:.375rem 1rem;font-size:.875rem;font-weight:700;border-radius:.375rem;background:#fff;box-shadow:0 1px 2px 0 rgba(0,0,0,.05);color:#1d4ed8;border:1px solid #e2e8f0;transition:all .15s;cursor:pointer;">Placa</button>
          <button id="btn-mode-siniestro" data-action="setMode" data-mode="siniestro"
            style="padding:.375rem 1rem;font-size:.875rem;font-weight:500;border-radius:.375rem;color:#64748b;border:0;transition:all .15s;cursor:pointer;background:transparent;">Siniestro</button>
        </div>

        <!-- Input y botón -->
        <div style="display:flex;align-items:center;gap:.5rem;flex:1;min-width:0;">
          <div style="position:relative;flex:1;max-width:22rem;display:flex;align-items:center;">
            <svg style="position:absolute;left:.75rem;width:1.25rem;height:1.25rem;color:#94a3b8;pointer-events:none;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="text" id="search-input" placeholder="GAV99R" maxlength="7"
              style="width:100%;padding:.5rem 2.25rem .5rem 2.5rem;background:#fff;border:1px solid #cbd5e1;border-radius:.5rem;font-size:1rem;font-family:ui-monospace,monospace;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#0f172a;transition:border-color .15s;"
              onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#cbd5e1'">
            <button data-action="clearSearch" title="Limpiar"
              style="position:absolute;right:.5rem;color:#94a3b8;padding:.375rem;border-radius:9999px;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;">
              <svg style="width:1rem;height:1rem;pointer-events:none;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>
          <button data-action="executeSearch"
            style="background:#002b66;color:#fff;padding:.5rem 1.5rem;border-radius:.5rem;font-weight:700;font-size:.875rem;text-transform:uppercase;letter-spacing:.025em;border:0;box-shadow:0 1px 2px 0 rgba(0,0,0,.05);flex-shrink:0;transition:background .15s;cursor:pointer;"
            onmouseover="this.style.background='#001f4d'" onmouseout="this.style.background='#002b66'">
            Buscar
          </button>
        </div>
      </div>

      <!-- Mensaje de estado -->
      <div id="status-message-container" style="display:none;align-items:center;padding-top:.5rem;">
        <span id="status-message" style="font-size:.875rem;font-weight:500;display:flex;align-items:center;gap:.375rem;"></span>
      </div>
    </section>

    <!-- Resultados -->
    <section id="results-container"></section>
  </main>

  <!-- FOOTER -->
  <footer style="background:linear-gradient(135deg,#002b66 0%,#004b87 100%);color:#dbeafe;padding:.625rem 1rem;text-align:center;font-size:.75rem;font-weight:500;letter-spacing:.025em;">
    <p style="margin:0;">Mercantil Seguros | Consulta de Estatus de Siniestros - AutoFast / SAM</p>
  </footer>

</div><!-- /#app -->

<!-- MODAL: Ayuda de estatus -->
<div id="modal-status-help" style="position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(4px);z-index:60;display:none;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:.75rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);max-width:24rem;width:100%;border:1px solid #e2e8f0;overflow:hidden;">
    <div style="background:#eff6ff;border-bottom:1px solid #dbeafe;padding:1rem 1.25rem;display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem;">
      <div style="display:flex;align-items:flex-start;gap:.75rem;">
        <svg style="width:1.5rem;height:1.5rem;color:#2563eb;flex-shrink:0;margin-top:.125rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <div>
          <h4 style="font-size:.75rem;font-weight:700;color:#1e40af;text-transform:uppercase;letter-spacing:.05em;margin:0 0 .25rem;">Significado del Estatus</h4>
          <h3 id="modal-status-title" style="font-weight:900;font-size:.875rem;color:#0f172a;line-height:1.375;margin:0;"></h3>
        </div>
      </div>
      <button data-action="closeStatusHelp" style="width:2rem;height:2rem;flex-shrink:0;border-radius:9999px;background:rgba(219,234,254,.5);display:flex;align-items:center;justify-content:center;border:0;color:#1e40af;cursor:pointer;">
        <svg style="width:1.25rem;height:1.25rem;pointer-events:none;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div style="padding:1.25rem;background:#fff;">
      <p id="modal-status-desc" style="color:#475569;font-size:.875rem;line-height:1.625;font-weight:500;margin:0;"></p>
    </div>
    <div style="background:#f8fafc;padding:.75rem 1.25rem;border-top:1px solid #f1f5f9;display:flex;justify-content:flex-end;">
      <button data-action="closeStatusHelp" style="background:#fff;border:1px solid #cbd5e1;color:#334155;padding:.5rem 1.25rem;border-radius:.5rem;font-size:.875rem;font-weight:700;box-shadow:0 1px 2px 0 rgba(0,0,0,.05);cursor:pointer;">Entendido</button>
    </div>
  </div>
</div>

<script src="api-simulator.js"></script>
<script src="app.js"></script>
