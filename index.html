<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Estatus de Siniestros | Seguros Mercantil</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="h-full flex flex-col overflow-hidden">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 mercantil-gradient text-white shadow-md border-b border-white/10 shrink-0">
        <div class="max-w-7xl mx-auto px-4 h-14 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <div class="bg-white px-2.5 py-1.5 rounded-lg shadow-sm flex items-center">
                    <img src="https://www.mercantilseguros.com/_next/image?url=https%3A%2F%2Fd54puq9p05rso.cloudfront.net%2Flanding%2Fimages%2Fweb%2Fcentenary-logo.png&w=256&q=75" alt="Mercantil Seguros" class="h-8 w-auto object-contain">
                </div>
                <div class="hidden sm:block border-l border-blue-400/40 pl-3">
                    <h1 class="text-sm font-semibold tracking-wide text-white">Consulta de Estatus de Siniestros</h1>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-full bg-white/10 border border-white/20 flex items-center justify-center text-white">
                    <svg class="w-5 h-5 opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-2 md:px-4 py-3 flex flex-col min-h-0">

        <!-- Barra de búsqueda -->
        <section class="bg-white p-3 md:p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-3 shrink-0">
            <div class="flex flex-col md:flex-row md:items-center gap-3 md:gap-4">

                <!-- Selector de modo -->
                <div class="flex bg-slate-100 p-1 rounded-lg border border-slate-200 shrink-0 w-fit">
                    <button id="btn-mode-placa" data-action="setMode" data-mode="placa" class="px-4 py-1.5 text-sm font-bold rounded-md bg-white shadow-sm text-blue-700 border border-slate-200 transition-all">Placa</button>
                    <button id="btn-mode-siniestro" data-action="setMode" data-mode="siniestro" class="px-4 py-1.5 text-sm font-medium rounded-md text-slate-500 hover:text-slate-700 transition-all">Siniestro</button>
                </div>

                <!-- Input y botón buscar -->
                <div class="flex items-center gap-2 w-full md:w-auto flex-1">
                    <div class="relative w-full md:w-[320px] flex items-center">
                        <svg class="absolute left-3 w-5 h-5 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                        <input type="text" id="search-input" value="ABC123" placeholder="ABC123" maxlength="6"
                            class="w-full pl-10 pr-9 py-2 bg-white border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-base font-mono font-bold uppercase tracking-wider text-slate-900">
                        <button data-action="clearSearch" title="Limpiar"
                            class="absolute right-2 text-slate-400 hover:text-slate-600 p-1.5 transition-colors rounded-full hover:bg-slate-100">
                            <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                    <button data-action="executeSearch"
                        class="bg-[#002b66] text-white px-6 py-2 rounded-lg font-bold hover:bg-[#001f4d] transition-all shadow-sm shrink-0 text-sm md:text-base uppercase">
                        Buscar
                    </button>
                </div>
            </div>

            <!-- Mensaje de estado -->
            <div id="status-message-container" class="hidden items-center pt-2">
                <span id="status-message" class="text-sm font-medium flex items-center gap-1.5"></span>
            </div>
        </section>

        <!-- Resultados -->
        <section id="results-container" class="flex-1 flex flex-col min-h-0 mt-3"></section>
    </main>

    <!-- FOOTER -->
    <footer class="shrink-0 mercantil-gradient text-blue-100 py-2.5 px-4 text-center text-xs md:text-sm font-medium tracking-wide z-40 shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
        <p>Mercantil Seguros | Consulta de Estatus de Siniestros - AutoFast / SAM</p>
    </footer>

    <!-- MODAL: Ayuda de estatus -->
    <div id="modal-status-help" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full border border-slate-200 overflow-hidden">
            <div class="bg-blue-50 border-b border-blue-100 px-5 py-4 flex justify-between items-start gap-3">
                <div class="flex items-start gap-3">
                    <svg class="w-6 h-6 text-blue-600 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <div>
                        <h4 class="text-xs font-bold text-blue-800 uppercase tracking-wider mb-1">Significado del Estatus</h4>
                        <h3 id="modal-status-title" class="font-black text-sm md:text-base text-slate-900 leading-tight"></h3>
                    </div>
                </div>
                <button data-action="closeStatusHelp" class="w-8 h-8 shrink-0 rounded-full bg-blue-100/50 flex items-center justify-center hover:bg-blue-200 transition text-blue-800">
                    <svg class="w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="p-5 bg-white">
                <p id="modal-status-desc" class="text-slate-600 text-sm md:text-base leading-relaxed font-medium"></p>
            </div>
            <div class="bg-slate-50 px-5 py-3 border-t border-slate-100 flex justify-end">
                <button data-action="closeStatusHelp" class="bg-white border border-slate-300 text-slate-700 px-5 py-2 rounded-lg text-sm font-bold hover:bg-slate-50 shadow-sm transition-all">
                    Entendido
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL: Visor de documento -->
    <div id="modal-doc" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[85vh] flex flex-col overflow-hidden border border-slate-200">
            <div class="bg-slate-50 border-b border-slate-200 px-5 py-4 flex justify-between items-center">
                <h3 id="modal-doc-title" class="font-bold text-base text-slate-800 flex items-center gap-2"></h3>
                <button data-action="closeDoc" class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center hover:bg-slate-300 transition text-slate-600">
                    <svg class="w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div id="modal-doc-body" class="p-5 overflow-y-auto flex-1 bg-white space-y-4"></div>
            <div class="bg-slate-50 px-5 py-3 border-t border-slate-200 flex justify-end space-x-3">
                <button data-action="printDoc" class="mercantil-gradient text-white px-5 py-2.5 rounded-lg text-sm font-bold hover:opacity-95 shadow-sm flex items-center gap-2">
                    <svg class="w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>
                    </svg>
                    Imprimir / PDF
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
